name: 每日股市新聞

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行程式
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
          DISCORD_TW: ${{ secrets.DISCORD_TW }}
          DISCORD_US: ${{ secrets.DISCORD_US }}
          DISCORD_GLOBAL: ${{ secrets.DISCORD_GLOBAL }}
        run: python stock_news.py
