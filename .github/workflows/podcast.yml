name: 🎙️ Podcast 追蹤與分析

on:
  schedule:
    # 台灣時間 09:00 = UTC 01:00
    - cron: '0 1 * * *'
    # 台灣時間 21:00 = UTC 13:00
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}-v1

      - name: 📦 安裝套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser anthropic pytz faster-whisper

      - name: 🕐 確認台北時間
        run: |
          python -c "import pytz; from datetime import datetime; tz=pytz.timezone('Asia/Taipei'); print('台北時間:', datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S %Z'))"

      - name: 🎙️ 執行 Podcast 追蹤
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 Podcast/podcast_tracker.py

      - name: 💾 更新狀態檔（podcast_state.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast_state.json
          git diff --staged --quiet || git commit -m "chore: update podcast state [skip ci]"
          git push
