name: 🎙️ Podcast 追蹤與分析

on:
  schedule:
    # 台灣時間 09:00 → UTC 00:55（提前5min觸發，加 GitHub 排隊延遲約到 09:00±5min）
    - cron: '55 0 * * *'
    # 台灣時間 21:00 → UTC 12:55
    - cron: '55 12 * * *'
  workflow_dispatch:

concurrency:
  group: podcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}-v1

      - name: 📦 安裝套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser anthropic pytz faster-whisper ntplib

      - name: 🕐 台灣標準時間驗證
        run: |
          python -X utf8 -c "
          import ntplib, pytz, datetime
          TW = pytz.timezone('Asia/Taipei')
          try:
              c    = ntplib.NTPClient()
              resp = c.request('time.stdtime.gov.tw', version=3, timeout=5)
              tw   = datetime.datetime.fromtimestamp(resp.tx_time, tz=TW)
              print(f'✅ 台灣標準時間（NTP）：{tw.strftime(\"%Y-%m-%d %H:%M:%S %Z\")}')
          except Exception as e:
              tw = datetime.datetime.now(TW)
              print(f'⚠️  NTP 失敗，使用系統時間：{tw.strftime(\"%Y-%m-%d %H:%M:%S %Z\")}')
          sys_tw = datetime.datetime.now(TW)
          diff   = abs((tw - sys_tw).total_seconds())
          print(f'系統差異：{diff:.1f} 秒  |  台北小時：{tw.hour:02d}時')
          "
          echo "TZ 驗證完成"

      - name: 📥 取得最新 Podcast 狀態（防誤判）
        run: |
          git fetch origin main
          git checkout origin/main -- podcast_state.json 2>/dev/null || echo "podcast_state.json 不存在，首次執行"

      - name: 🎙️ 執行 Podcast 追蹤
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 Podcast/podcast_tracker.py

      - name: 💾 更新狀態檔（podcast_state.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast_state.json
          git diff --staged --quiet || git commit -m "chore: update podcast state [skip ci]"
          git pull --rebase origin main
          git push
