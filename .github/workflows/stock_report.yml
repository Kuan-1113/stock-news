name: 股市日報自動執行

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 台灣時間 15:00 = UTC 07:00（GitHub 有延遲，設 07 保險）
    - cron: '0 7 * * *'
    # 台灣時間 22:00 = UTC 14:00
    - cron: '0 14 * * *'
  workflow_dispatch:  # 也可以手動觸發

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行日報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python stock_daily.py
