name: 台股日報自動發送（每天含週六日）

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:00（每天）
    - cron: '0 0 * * *'
    # 台灣時間 15:00 = UTC 07:00（每天）
    - cron: '0 7 * * *'
    # 台灣時間 22:00 = UTC 14:00（每天）
    - cron: '0 14 * * *'
  workflow_dispatch:
    # 允許手動觸發（測試用）

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 設定時區為台北，確保時間判斷正確
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser schedule anthropic pytz yfinance pandas pandas-ta

      - name: 🕐 確認目前台北時間
        run: |
          python -c "import pytz; from datetime import datetime; tz=pytz.timezone('Asia/Taipei'); print('台北時間:', datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S %Z'))"

      - name: 🚀 執行台股日報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 stock_daily.py
