name: 台股日報自動發送（每天含週六日）

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:10（錯開整點，避免 GitHub Actions 排隊延遲）
    - cron: '10 0 * * *'
    # 台灣時間 15:00 = UTC 07:10
    - cron: '10 7 * * *'
    # 台灣時間 22:00 = UTC 14:10
    - cron: '10 14 * * *'
  workflow_dispatch:
    # 允許手動觸發（測試用）

concurrency:
  group: stock-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 設定時區為台北，確保時間判斷正確
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser schedule anthropic pytz yfinance pandas zhconv

      - name: 🕐 確認台北時間 & 設定時段
        run: |
          python -c "import pytz; from datetime import datetime; tz=pytz.timezone('Asia/Taipei'); print('台北時間:', datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S %Z'))"
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "10 0 * * *" ]; then
            echo "REPORT_SESSION=morning"             >> $GITHUB_ENV
            echo "REPORT_SESSION_LABEL=盤前早報"      >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "10 7 * * *" ]; then
            echo "REPORT_SESSION=afternoon"           >> $GITHUB_ENV
            echo "REPORT_SESSION_LABEL=盤中午報"      >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "10 14 * * *" ]; then
            echo "REPORT_SESSION=evening"             >> $GITHUB_ENV
            echo "REPORT_SESSION_LABEL=盤後晚報"      >> $GITHUB_ENV
          else
            echo "REPORT_SESSION=auto"                >> $GITHUB_ENV
            echo "REPORT_SESSION_LABEL="              >> $GITHUB_ENV
          fi
          python -c "import pytz; from datetime import datetime; tz=pytz.timezone('Asia/Taipei'); print('TODAY_DATE='+datetime.now(tz).strftime('%Y-%m-%d'))" >> $GITHUB_ENV

      - name: 🚀 執行台股日報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
          REPORT_SESSION: ${{ env.REPORT_SESSION }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 股市日報/stock_daily.py

      - name: 💾 更新執行狀態（run_state.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先 fetch 最新版，再用 Python 合併寫入（避免並行競速覆蓋）
          git fetch origin main
          git checkout origin/main -- run_state.json 2>/dev/null || true
          python3 - <<'EOF'
          import json, os, sys
          f = "run_state.json"
          state = json.load(open(f, encoding="utf-8")) if os.path.exists(f) else {}
          today   = os.environ.get("TODAY_DATE", "")
          session = os.environ.get("REPORT_SESSION_LABEL", "")
          if today and session:
              state.setdefault(today, [])
              if session not in state[today]:
                  state[today].append(session)
          # 保留最近 7 天
          from datetime import datetime, timedelta
          import pytz
          cutoff = (datetime.now(pytz.timezone("Asia/Taipei")) - timedelta(days=7)).strftime("%Y-%m-%d")
          state  = {k: v for k, v in state.items() if k >= cutoff}
          json.dump(state, open(f, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(f"run_state updated: {session} @ {today}")
          EOF
          git add run_state.json
          git diff --staged --quiet || git commit -m "chore: update run state [skip ci]"
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
