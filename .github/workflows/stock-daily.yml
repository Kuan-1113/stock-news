name: 台股日報自動發送（每天含週六日）

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:10（錯開整點，避免 GitHub Actions 排隊延遲）
    - cron: '10 0 * * *'
    # 台灣時間 15:00 = UTC 07:10
    - cron: '10 7 * * *'
    # 台灣時間 22:00 = UTC 14:10
    - cron: '10 14 * * *'
  workflow_dispatch:
    # 允許手動觸發（測試用）

concurrency:
  group: stock-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 設定時區為台北，確保時間判斷正確
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser schedule anthropic pytz yfinance pandas zhconv

      - name: 🕐 確認台北時間 & 設定時段
        run: |
          python -c "import pytz; from datetime import datetime; tz=pytz.timezone('Asia/Taipei'); print('台北時間:', datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S %Z'))"
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "10 0 * * *" ]; then
            echo "REPORT_SESSION=morning"   >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "10 7 * * *" ]; then
            echo "REPORT_SESSION=afternoon" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "10 14 * * *" ]; then
            echo "REPORT_SESSION=evening"   >> $GITHUB_ENV
          else
            echo "REPORT_SESSION=auto"      >> $GITHUB_ENV
          fi

      - name: 🚀 執行台股日報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
          REPORT_SESSION: ${{ env.REPORT_SESSION }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 股市日報/stock_daily.py

      - name: 💾 更新執行狀態（run_state.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add run_state.json
          git diff --staged --quiet || git commit -m "chore: update run state [skip ci]"
          git pull --rebase origin main
          git push
