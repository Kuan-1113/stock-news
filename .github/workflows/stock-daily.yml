name: 台股日報自動發送（每天含週六日）

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:00 前5分鐘（加上排隊延遲約到 08:00±5min）
    - cron: '55 23 * * *'
    # 台灣時間 14:00 = UTC 06:00 前5分鐘
    - cron: '55 5 * * *'
    # 台灣時間 22:00 = UTC 14:00 前5分鐘
    - cron: '55 13 * * *'
  workflow_dispatch:
    inputs:
      report_session:
        description: '指定時段（空白=自動偵測）'
        required: false
        default: ''
        type: choice
        options: ['', 'morning', 'afternoon', 'evening']

concurrency:
  group: stock-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install requests feedparser schedule pytz zhconv anthropic

      - name: 🕐 設定時段（REPORT_SESSION）
        run: |
          # 手動觸發有指定時段 → 直接用
          if [ -n "${{ github.event.inputs.report_session }}" ]; then
            echo "REPORT_SESSION=${{ github.event.inputs.report_session }}" >> $GITHUB_ENV
            echo "✅ 手動指定時段：${{ github.event.inputs.report_session }}"
          else
            # 依 cron 排程自動設定
            SCHEDULE="${{ github.event.schedule }}"
            echo "DEBUG schedule='$SCHEDULE'"
            if   echo "$SCHEDULE" | grep -qE '^55\s+23(\s|$)'; then
              echo "REPORT_SESSION=morning"   >> $GITHUB_ENV
              echo "✅ 時段 → morning（盤前早報 台灣08:00）"
            elif echo "$SCHEDULE" | grep -qE '^55\s+5(\s|$)';  then
              echo "REPORT_SESSION=afternoon" >> $GITHUB_ENV
              echo "✅ 時段 → afternoon（盤中午報 台灣14:00）"
            elif echo "$SCHEDULE" | grep -qE '^55\s+13(\s|$)'; then
              echo "REPORT_SESSION=evening"   >> $GITHUB_ENV
              echo "✅ 時段 → evening（盤後晚報 台灣22:00）"
            else
              echo "REPORT_SESSION=auto"      >> $GITHUB_ENV
              echo "⚠️ 手動觸發未指定時段，Python 自動偵測"
            fi
          fi

      - name: 🚀 執行 Agent 股市日報（orchestrator.py）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_TW:        ${{ secrets.DISCORD_TW }}
          DISCORD_US:        ${{ secrets.DISCORD_US }}
          DISCORD_GLOBAL:    ${{ secrets.DISCORD_GLOBAL }}
          DISCORD_WATCHLIST: ${{ secrets.DISCORD_WATCHLIST }}
          JIN10_TOKEN:       ${{ secrets.JIN10_TOKEN }}
          REPORT_SESSION:    ${{ env.REPORT_SESSION }}
          PYTHONUTF8: "1"
          TZ: Asia/Taipei
        run: |
          python -X utf8 orchestrator.py
